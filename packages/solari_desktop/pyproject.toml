[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solari-desktop"
version = "0.2.0"
description = "Python SDK for Solari Desktop — managed, hardware-isolated Linux desktops with a computer-use action API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Solari" }]
keywords = ["solari", "desktop", "computer-use", "vnc", "automation"]
dependencies = ["solari-core==0.2.1"]

[project.urls]
Homepage = "https://getsolari.com"

[tool.hatch.build.targets.wheel]
packages = ["solari_desktop"]
